<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List - Nadia Risky Namora Siregar</title>
<style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #fff0f5; margin: 0; padding: 20px; }
  .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
  h1 { text-align: center; color: #d63384; margin: 0; }
  .subtitle { text-align: center; color: #888; margin: 5px 0 20px; }
  .progress-box { background: #ffe4ec; padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
  #progressText { font-weight: bold; color: #d63384; }
  .bar { background: white; height: 12px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
  #barFill { background: #ff69b4; height: 100%; width: 0%; transition: 0.3s; }
  .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
  input, select { padding: 12px; border: 2px solid #ffc0cb; border-radius: 12px; outline: none; }
  #taskInput { flex: 1; }
  #addBtn { background: #ff69b4; color: white; border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; }
  .filters { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
  .filters button { padding: 8px 15px; border-radius: 20px; border: 1px solid #ffc0cb; background: white; cursor: pointer; }
  .filters button.active { background: #ff69b4; color: white; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; background: #fff5f8; padding: 12px; border-radius: 12px; margin-bottom: 10px; }
  li.done span.task-text { text-decoration: line-through; color: #aaa; }
  .task-text { flex: 1; }
  .badge { font-size: 11px; padding: 4px 8px; border-radius: 10px; background: #ffe4ec; color: #d63384; }
  .del { background: none; border: none; font-size: 18px; cursor: pointer; }
  .footer { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🌸 My Life Dashboard 🌸</h1>
  <p class="subtitle">Nadia Risky Namora Siregar<br>CodingCamp - 16 November 2026</p>

  <div class="progress-box">
    <div id="progressText">0 dari 0 tugas selesai</div>
    <div class="bar"><div id="barFill"></div></div>
  </div>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Tulis tugas baru... contoh: Belajar HTML">
    <select id="category">
      <option value="Pribadi">Pribadi</option>
      <option value="Belajar">Belajar</option>
      <option value="Kerja">Kerja</option>
      <option value="Kesehatan">Kesehatan</option>
    </select>
    <button id="addBtn" onclick="addTask()">+ Tambah</button>
  </div>

  <div class="filters">
    <button onclick="setFilter('all', this)" class="active">Semua</button>
    <button onclick="setFilter('todo', this)">Belum Selesai</button>
    <button onclick="setFilter('done', this)">Selesai</button>
  </div>

  <ul id="taskList"></ul>

  <p class="footer">Dibuat oleh Nadia Risky Namora Siregar untuk RevoU Coding Camp</p>
</div>

<script>
  let tasks = [
    { text: "Belajar HTML, CSS, JavaScript", cat: "Belajar", done: false },
    { text: "Daftar AWS & Kiro", cat: "Belajar", done: false },
    { text: "Minum air putih 8 gelas", cat: "Kesehatan", done: false }
  ];
  let filter = 'all';

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    let filtered = tasks.filter(t => {
      if (filter === 'todo') return !t.done;
      if (filter === 'done') return t.done;
      return true;
    });
    filtered.forEach((t, index) => {
      const realIndex = tasks.indexOf(t);
      const li = document.createElement('li');
      if (t.done) li.className = 'done';
      li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${realIndex})">
        <span class="task-text">${t.text}</span>
        <span class="badge">${t.cat}</span>
        <button class="del" onclick="hapus(${realIndex})">🗑️</button>`;
      list.appendChild(li);
    });
    const doneCount = tasks.filter(t => t.done).length;
    document.getElementById('progressText').innerText = `${doneCount} dari ${tasks.length} tugas selesai`;
    document.getElementById('barFill').style.width = tasks.length ? (doneCount / tasks.length * 100) + '%' : '0%';
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const cat = document.getElementById('category').value;
    if (input.value.trim() === '') { alert('Tulis dulu tugasnya ya!'); return; }
    tasks.push({ text: input.value, cat: cat, done: false });
    input.value = '';
    render();
  }

  function toggle(i) { tasks[i].done = !tasks[i].done; render(); }
  function hapus(i) { tasks.splice(i, 1); render(); }
  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }
  document.getElementById('taskInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addTask();
  });
  render();
</script>
</body>
</html>
