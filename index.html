<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Dashboard - Nadia</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <div class="top-card">
    <div id="clock">10:45:22</div>
    <div id="date">Tuesday, January 27, 2026</div>
    <h1 id="greeting">Good Morning</h1>
    <p style="margin-top:15px;">Ubah nama: <input type="text" id="nameInput" placeholder="Nama kamu..." style="width:150px; display:inline-block;"> <button onclick="saveName()">Simpan</button> <button onclick="toggleTheme()">🌙 Dark Mode</button></p>
  </div>
  <div class="grid">
    <div class="card">
      <h2>Focus Timer</h2>
      <div id="timerDisplay">25:00</div>
      <p style="text-align:center; font-size:13px;">Ubah: <input type="number" id="timerMinutes" value="25" style="width:55px; display:inline-block;"> <button onclick="setTimer()">Set</button></p>
      <div class="timer-btns">
        <button onclick="startTimer()">Start</button>
        <button onclick="stopTimer()" style="background:#e0e0e0; color:#333;">Stop</button>
        <button onclick="resetTimer()" style="background:#e0e0e0; color:#333;">Reset</button>
      </div>
      <p id="timerStatus" style="text-align:center; font-size:13px;">Siap fokus!</p>
    </div>
    <div class="card">
      <h2 style="text-align:left;">Tasks</h2>
      <div style="display:flex; gap:5px;"><input type="text" id="taskInput" placeholder="Add a new task..."><button onclick="addTask()">Add</button></div>
      <select id="categoryInput"><option>Pribadi</option><option>Belajar</option><option>Kerja</option><option>Kesehatan</option></select>
      <p id="progressText" style="font-size:13px;">0 dari 0 tugas selesai</p>
      <div id="progressBarWrap"><div id="progressBar"></div></div>
      <div><button onclick="setFilter('all')">Semua</button> <button onclick="setFilter('active')">Belum</button> <button onclick="setFilter('done')">Selesai</button></div>
      <ul id="taskList" style="padding:0;"></ul>
    </div>
    <div class="card">
      <h2 style="text-align:left;">Quick Links</h2>
      <div style="display:flex; gap:5px;"><input type="text" id="linkName" placeholder="Link name"><input type="text" id="linkUrl" placeholder="URL"><button onclick="addLink()">Add Link</button></div>
      <div id="linkList" style="margin-top:10px;"></div>
    </div>
  </div>
  <p style="text-align:center; color:white; margin-top:15px;">Dibuat oleh Nadia Risky Namora Siregar</p>
</div>
<script src="js/script.js"></script>
</body>
</html>
